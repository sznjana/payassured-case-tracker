<!DOCTYPE html>
<html>
<head>
    <title>Add Recovery Case</title>
    <style>
        body { font-family: sans-serif; margin: 40px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; }
        input, select { padding: 8px; width: 320px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Create New Recovery Case</h1>
    <form action="/cases" method="post">
        <div class="form-group">
            <label>Select Client</label>
            <select name="client_id" required>
                {% for client in clients %}
                <option value="{{ client.id }}">{{ client.client_name }} ({{ client.company_name }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Invoice Number</label>
            <input type="text" name="invoice_number" placeholder="INV-1001" required>
        </div>
        <div class="form-group">
            <label>Invoice Amount (₹)</label>
            <input type="number" name="invoice_amount" step="0.01" required>
        </div>
        <div class="form-group">
            <label>Due Date</label>
            <input type="date" name="due_date" required>
        </div>
        <button type="submit">Create Case</button>
    </form>
    <br>
    <a href="/">Back to Dashboard</a>
</body>
</html>
