<!DOCTYPE html>
<html>
<head>
    <title>Case Details</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; max-width: 500px; }
        .status-tag { font-weight: bold; color: #007bff; }
        textarea { width: 100%; height: 100px; margin-top: 10px; }
        button { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Case Details: {{ case.invoice_number }}</h1>
    <div class="card">
        <p><strong>Client:</strong> {{ case.owner.client_name }}</p>
        <p><strong>Amount:</strong> ₹{{ case.invoice_amount }}</p>
        <p><strong>Due Date:</strong> {{ case.due_date }}</p>
        <p><strong>Current Status:</strong> <span class="status-tag">{{ case.status }}</span></p>

        <hr>
        
        <form action="/cases/{{ case.id }}/update" method="post">
            <label><strong>Update Status:</strong></label><br>
            <select name="status">
                <option value="New" {% if case.status == 'New' %}selected{% endif %}>New</option>
                <option value="In Follow-up" {% if case.status == 'In Follow-up' %}selected{% endif %}>In Follow-up</option>
                <option value="Partially Paid" {% if case.status == 'Partially Paid' %}selected{% endif %}>Partially Paid</option>
                <option value="Closed" {% if case.status == 'Closed' %}selected{% endif %}>Closed</option>
            </select>
            <br><br>
            <label><strong>Follow-up Notes:</strong></label>
            <textarea name="notes">{{ case.last_follow_up_notes or '' }}</textarea>
            <button type="submit">Update Case</button>
        </form>
    </div>
    <br>
    <a href="/">Back to Dashboard</a>
</body>
</html>
